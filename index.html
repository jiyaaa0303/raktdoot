<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Raktdoot: Emergency Blood Donor Finder (prototype)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="stage">
  <aside class="panel">
    <h1>Raktdoot</h1>
    <p class="sub">Emergency blood donor finder. A design-under-panic prototype.</p>
    <div class="seg" role="group" aria-label="Choose view">
      <button data-act="mode" data-v="req" class="on">Requester view</button>
      <button data-act="mode" data-v="donor">Donor view</button>
    </div>
    <div class="counter" aria-live="polite">Taps so far: <strong id="taps">0</strong></div>
    <p class="hint">Goal: send a request in 2 taps. Pick a blood group, then send.</p>
    <button class="ghost" data-act="restart">Restart demo</button>
    <p class="fine">All donors, names and numbers are sample data.</p>
  </aside>
  <section class="phone" aria-label="App prototype">
    <div id="screen" class="screen"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
